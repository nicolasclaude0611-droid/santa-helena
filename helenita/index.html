<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Helenita · Estudio de motion</title>
  <link rel="icon" type="image/png" href="../img/logo.png">
  <link href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,400;0,600;0,700;1,600;1,700;1,800&display=swap" rel="stylesheet">
  <style>
    :root { --ink:#0A2233; --muted:#4A6171; --line:#CAD7E0; --mist:#EFF4F7; --blue:#0596C8; --gold:#FFE81A; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: Figtree, system-ui, sans-serif; color:var(--ink); background:var(--mist); }
    .wrap { max-width: 1320px; margin: 0 auto; padding: 20px 16px 40px; }
    header { display:flex; align-items:center; gap:14px; margin-bottom:14px; }
    header img { height:44px; }
    h1 { font-size: 1.25rem; margin:0; }
    header p { margin:0; color:var(--muted); font-size:.92rem; }

    .stage-box { position:relative; width:100%; aspect-ratio:16/9; border-radius:18px; overflow:hidden; background:#fff; box-shadow:0 1px 0 var(--line), 0 18px 40px -24px rgba(10,34,51,.35); }
    .stage { position:absolute; left:0; top:0; width:1280px; height:720px; transform-origin:0 0; overflow:hidden; }
    .stage svg { position:absolute; width:1236px; height:1236px; left:22px; top:0; transform-origin:618px 600px; }
    .stage[data-frame="cuerpo"] svg { transform: translate(0, -205px) scale(.5); }
    .stage[data-frame="primer"] svg { transform: translate(0, 300px) scale(1.75); transform-origin:618px 160px; }
    .stage[data-bg="blanco"] { background:#fff; }
    .stage[data-bg="marca"] { background: radial-gradient(circle at 70% 30%, #E7F5FB 0, #fff 55%); }
    .stage[data-bg="marca"]::before { content:""; position:absolute; right:-80px; top:-60px; width:420px; height:420px; background:url(../img/sol.png) center/contain no-repeat; opacity:.18; }
    .stage[data-bg="transparente"] { background: transparent; }
    .stage-box.checker { background: repeating-conic-gradient(#eef2f5 0 25%, #fff 0 50%) 0 0/24px 24px; }

    .controls { display:flex; flex-wrap:wrap; gap:8px; margin:16px 0 10px; }
    .controls button { font:inherit; font-weight:600; border:1px solid var(--line); background:#fff; color:var(--ink); padding:9px 14px; border-radius:999px; cursor:pointer; }
    .controls button[aria-pressed="true"] { background:var(--ink); color:#fff; border-color:var(--ink); }
    .bar { display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
    .bar input[type=range] { flex:1; min-width:180px; accent-color: var(--blue); }
    .bar select, .bar .btn { font:inherit; border:1px solid var(--line); background:#fff; padding:8px 12px; border-radius:10px; }
    .time { font-variant-numeric: tabular-nums; color:var(--muted); min-width:92px; }
    .ref { margin-top:22px; display:grid; grid-template-columns: repeat(auto-fit, minmax(240px,1fr)); gap:12px; }
    .ref figure { margin:0; background:#fff; border-radius:14px; padding:8px; }
    .ref img, .ref video { width:100%; border-radius:10px; display:block; }
    .ref figcaption { font-size:.85rem; color:var(--muted); padding:6px 4px 0; }

    /* modo render (usado por render.js): solo el escenario a 1280x720 */
    body.render { background: transparent; }
    body.render .wrap > :not(.stage-box) { display:none; }
    body.render .wrap { padding:0; max-width:none; }
    body.render .stage-box { width:1280px; height:720px; border-radius:0; box-shadow:none; background:transparent; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <img src="../img/logo.png" alt="Santa Helena del Valle IPS">
      <div>
        <h1>Helenita · Estudio de motion</h1>
        <p>Personaje vectorial articulado. Elija un movimiento, encuadre y fondo.</p>
      </div>
    </header>

    <div class="stage-box" id="box">
      <div class="stage" id="stage" data-frame="medio" data-bg="blanco"></div>
    </div>

    <div class="controls" id="motions"></div>
    <div class="bar">
      <button class="btn" id="play" type="button">Pausa</button>
      <input type="range" id="scrub" min="0" max="1000" value="0" aria-label="Línea de tiempo">
      <span class="time" id="time">0.00 s</span>
      <select id="frame" aria-label="Encuadre">
        <option value="medio">Medio cuerpo</option>
        <option value="cuerpo">Cuerpo entero</option>
        <option value="primer">Primer plano</option>
      </select>
      <select id="bg" aria-label="Fondo">
        <option value="blanco">Fondo blanco</option>
        <option value="marca">Fondo de marca</option>
        <option value="transparente">Transparente</option>
      </select>
    </div>

    <section class="ref" aria-label="Referencias">
      <figure><img src="../img/helenita-closeup.jpg" alt=""><figcaption>Referencia: ilustración oficial</figcaption></figure>
      <figure><video src="../media/helenita-saludando.mp4" autoplay muted loop playsinline></video><figcaption>Referencia: video de saludo</figcaption></figure>
    </section>
  </div>

  <script src="helenita.js"></script>
  <script src="motions.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const stage = document.getElementById('stage');
    const box = document.getElementById('box');
    if (params.has('render')) document.body.classList.add('render');
    if (params.get('frame')) stage.dataset.frame = params.get('frame');
    if (params.get('bg')) stage.dataset.bg = params.get('bg');

    const rig = Helenita.create(stage);
    const player = Helenita.player(rig, HELENITA_MOTIONS);
    window.helenita = { rig, player, motions: HELENITA_MOTIONS };

    function fit() {
      const s = box.clientWidth / 1280;
      stage.style.transform = `scale(${s})`;
    }
    addEventListener('resize', fit); fit();

    // UI
    const list = document.getElementById('motions');
    const playBtn = document.getElementById('play');
    const scrub = document.getElementById('scrub');
    const time = document.getElementById('time');
    let currentName = params.get('motion') || 'saludar';

    function select(name) {
      currentName = name;
      list.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', b.dataset.m === name));
      player.play(name); playBtn.textContent = 'Pausa';
    }
    for (const [name, m] of Object.entries(HELENITA_MOTIONS)) {
      const b = document.createElement('button');
      b.type = 'button'; b.dataset.m = name; b.textContent = m.label || name;
      b.onclick = () => select(name);
      list.appendChild(b);
    }
    player.onTick = (t, m) => {
      const tl = m.loop ? t % m.duration : t;
      scrub.value = Math.round(tl / m.duration * 1000);
      time.textContent = `${tl.toFixed(2)} / ${m.duration.toFixed(1)} s`;
    };
    playBtn.onclick = () => {
      if (player.playing) { player.pause(); playBtn.textContent = 'Reproducir'; }
      else { player.resume(); playBtn.textContent = 'Pausa'; }
    };
    scrub.oninput = () => { player.pause(); playBtn.textContent = 'Reproducir'; player.seek(scrub.value / 1000 * player.motion.duration); };
    document.getElementById('frame').onchange = e => stage.dataset.frame = e.target.value;
    document.getElementById('bg').onchange = e => {
      stage.dataset.bg = e.target.value; box.classList.toggle('checker', e.target.value === 'transparente');
    };

    if (params.has('render')) { player.play(currentName); player.pause(); player.seek(+params.get('t') || 0); }
    else select(currentName);
  </script>
</body>
</html>
